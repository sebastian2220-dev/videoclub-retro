name: Visual check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install -D playwright
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/videoclub-http.log 2>&1 &
          sleep 2

      - name: Capture visual states
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1920, height: 1080 } });
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            page.on('console', msg => {
              if (msg.type() === 'error') errors.push(msg.text());
            });

            await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' });
            await page.waitForTimeout(500);

            const diagnostic = await page.evaluate(() => {
              const scripts = [...document.scripts].map(s => s.src || '(inline)');
              const resources = performance.getEntriesByType('resource')
                .map(r => r.name)
                .filter(name => name.includes('woman-idle') || name.includes('game.js'));
              const game = Phaser.GAMES && Phaser.GAMES[0];
              let scene = null;
              let sceneInfo = null;
              if (game) {
                try {
                  scene = game.scene.getScene('Entrada');
                  sceneInfo = {
                    exists: !!scene,
                    status: scene && scene.sys && scene.sys.settings ? scene.sys.settings.status : null,
                    active: scene && scene.sys && typeof scene.sys.isActive === 'function' ? scene.sys.isActive() : null,
                    entradaTexture: !!(scene && scene.textures && scene.textures.exists('entrada')),
                    womanReady: !!(scene && scene.__womanIdleReady),
                    womanObjects: !!(scene && scene.__womanIdleObjects)
                  };
                } catch (e) {
                  sceneInfo = { error: String(e) };
                }
              }
              return {
                scripts,
                resources,
                games: Phaser.GAMES ? Phaser.GAMES.length : 0,
                sceneInfo
              };
            });
            console.log('WOMAN_DIAGNOSTIC=' + JSON.stringify(diagnostic));

            const womanStates = [];
            for (let i = 0; i < 5; i++) {
              const state = await page.evaluate(() => {
                const game = Phaser.GAMES && Phaser.GAMES[0];
                if (!game) return null;
                const scene = game.scene.getScene('Entrada');
                const head = scene && scene.__womanIdleObjects && scene.__womanIdleObjects.headContainer;
                if (!head) return null;
                return { x: head.x, y: head.y, angle: head.angle, visible: head.visible };
              });
              womanStates.push(state);
              await page.waitForTimeout(250);
            }
            console.log('WOMAN_STATES=' + JSON.stringify(womanStates));

            if (womanStates.some(state => !state || !state.visible)) {
              errors.push('La capa animada de la mujer no se creó o no está visible.');
            } else {
              const xs = womanStates.map(s => s.x);
              const ys = womanStates.map(s => s.y);
              const angles = womanStates.map(s => s.angle);
              const range = arr => Math.max(...arr) - Math.min(...arr);
              if (range(xs) < 1 && range(ys) < 1 && range(angles) < 0.2) {
                errors.push('La cabeza de la mujer existe, pero no está cambiando de posición ni ángulo.');
              }
            }

            await page.screenshot({ path: 'woman-01.png', fullPage: true });
            await page.waitForTimeout(450);
            await page.screenshot({ path: 'woman-02.png', fullPage: true });
            await page.waitForTimeout(300);
            await page.screenshot({ path: 'neon-03-retro.png', fullPage: true });
            await page.waitForTimeout(550);
            await page.screenshot({ path: 'neon-04-abierto.png', fullPage: true });
            await page.waitForTimeout(1600);
            await page.screenshot({ path: 'neon-05-estable.png', fullPage: true });

            await page.mouse.move(960, 890);
            await page.waitForTimeout(400);
            await page.screenshot({ path: 'neon-06-hover.png', fullPage: true });

            if (errors.length) {
              console.error(errors.join('\n'));
              process.exitCode = 1;
            }
            await browser.close();
          })();
          NODE

      - name: Show HTTP requests
        if: always()
        run: cat /tmp/videoclub-http.log || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-check
          path: |
            woman-01.png
            woman-02.png
            neon-03-retro.png
            neon-04-abierto.png
            neon-05-estable.png
            neon-06-hover.png
          if-no-files-found: error
          retention-days: 7
