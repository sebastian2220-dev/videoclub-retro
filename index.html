<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Videoclub Retro</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #080910; overflow: hidden; }
    #game { width: 100vw; height: 100vh; }
    canvas { display: block; margin: 0 auto; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game"></div>

  <script>
    // Phaser 3.90 ya no nos entrega una instancia útil mediante Phaser.GAMES
    // en este proyecto. Guardamos la instancia real cuando game.js la crea.
    const VideoclubOriginalGame = Phaser.Game;
    Phaser.Game = class VideoclubGame extends VideoclubOriginalGame {
      constructor(...args) {
        super(...args);
        window.videoclubGame = this;
      }
    };
  </script>

  <script src="game.js"></script>
  <script src="neon-extra.js"></script>
  <script src="woman-idle.js"></script>
</body>
</html>
